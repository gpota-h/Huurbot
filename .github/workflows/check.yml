name: huurbot

# Checks Dutch rental sites and emails you when something new appears.
# Runs on GitHub's servers, so it needs no laptop.
#
# HOW OFTEN IT REALLY RUNS
# GitHub's cron is best-effort: jobs start when capacity allows, and a frequent
# schedule on a small repo gets deprioritised to roughly hourly. So rather than
# fight that, each run stays alive for ~50 minutes and checks every 6 minutes
# itself. The cron is hourly, which GitHub does honour. Runs stay under an hour,
# so they never queue behind each other or pile up as cancelled runs.
#
# Actions minutes are free and unlimited on PUBLIC repos. Keep the repo public.
#
# SETUP
#   Secrets (Settings > Secrets and variables > Actions):
#     SMTP_USERNAME   your.name@gmail.com
#     SMTP_PASSWORD   16-char Gmail app password (not your login password)
#     MAIL_TO         where alerts go; comma-separate for several
#   Then run once with mode: seed, or your first email contains every listing.
#
# Modes: check (normal) | seed (mark all seen, no email) | test-email

on:
  schedule:
    - cron: '7 * * * *'      # hourly, off the hour to dodge the queue rush
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | seed | test-email | status (health report now)'
        type: choice
        options: [check, seed, test-email, status]
        default: check

permissions:
  contents: write

concurrency:
  group: huurbot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check the files are all there
        # Turns a cryptic pip/Python error into a plain message. Uploading from
        # a phone often renames or converts files, which is easy to miss.
        run: |
          fail=0
          for f in huurbot.py config.yaml requirements.txt; do
            if [ -f "$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"; fail=1
              case "$f" in
                requirements.txt) ls requirements.* 2>/dev/null && echo "        ^ rename that to requirements.txt (delete and recreate if it is a .pdf)" ;;
                config.yaml)      ls config.* 2>/dev/null && echo "        ^ rename config.yml to config.yaml (the script wants .yaml)" ;;
              esac
            fi
          done
          if [ "$fail" = "1" ]; then
            echo ""
            echo "Files actually in the repo:"; ls -1
            exit 1
          fi

      - run: pip install -r requirements.txt

      - name: Run
        env:
          HUURBOT_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          HUURBOT_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HUURBOT_MAIL_TO: ${{ secrets.MAIL_TO }}
          MODE: ${{ inputs.mode || 'check' }}     # inputs is empty on cron runs
          CHECK_EVERY_MIN: '6'
          RUN_FOR_MIN: '50'
          # Send a "still running" status email at the start of a run. It lists
          # what each site returned, so you can tell "working, nothing new" from
          # "silently broken". Every run = ~24 emails/day, which gets noisy fast.
          # Set to a comma-separated list of UTC hours to limit it, e.g. '7,19'
          # for twice a day. 'always' = every run. 'never' = off.
          STATUS_EMAIL_HOURS: '7,19'
        run: |
          set -uo pipefail
          git config user.name  "huurbot"
          git config user.email "huurbot@users.noreply.github.com"

          save_state() {
            [ -f seen.txt ] || return 0
            git add seen.txt || return 0
            git diff --staged --quiet && return 0
            git commit -q -m "seen listings $(date -u +%Y-%m-%dT%H:%M)" || return 0
            for i in 1 2 3; do
              git pull -q --rebase --autostash && git push -q && return 0
              sleep 5
            done
            echo "WARNING: could not push state; next run may re-alert"
          }

          case "$MODE" in
            seed)       python huurbot.py --seed --state-file seen.txt; save_state; exit 0 ;;
            test-email) python huurbot.py --test-email; exit 0 ;;
            status)     python huurbot.py --status --state-file seen.txt; save_state; exit 0 ;;
          esac

          # Proof-of-life email, if this hour is on the list
          hour=$(date -u +%-H)
          send_status=0
          case "$STATUS_EMAIL_HOURS" in
            never)  send_status=0 ;;
            always) send_status=1 ;;
            *)      for h in ${STATUS_EMAIL_HOURS//,/ }; do
                      [ "$h" = "$hour" ] && send_status=1
                    done ;;
          esac
          if [ "$send_status" = "1" ]; then
            echo "::group::status email"
            python huurbot.py --status --state-file seen.txt || echo "status email failed"
            save_state
            echo "::endgroup::"
          fi

          deadline=$(( SECONDS + RUN_FOR_MIN * 60 ))
          interval=$(( CHECK_EVERY_MIN * 60 ))
          round=1
          while :; do
            started=$SECONDS
            echo "::group::check $round  $(date -u +%H:%M:%S) UTC"
            python huurbot.py --once --state-file seen.txt || echo "check failed, continuing"
            save_state
            echo "::endgroup::"

            elapsed=$(( SECONDS - started ))
            nap=$(( interval - elapsed )); [ "$nap" -lt 30 ] && nap=30
            remaining=$(( deadline - SECONDS ))
            [ "$remaining" -le "$nap" ] && break
            sleep "$nap"
            round=$(( round + 1 ))
          done
          echo "done: $round checks this run"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: huurbot-log
          path: huurbot.log
          if-no-files-found: ignore
